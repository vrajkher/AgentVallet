name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[api,mcp,dev]"
      - name: Lint
        run: |
          ruff check src tests examples
          ruff format --check src tests
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -q
      - name: Validate example skills
        run: |
          export AV_HOME="$RUNNER_TEMP/avhome"
          for s in examples/*/; do av skill add "$s"; done
          for s in examples/*/; do av skill validate "$(basename "$s")"; done
          av doctor
