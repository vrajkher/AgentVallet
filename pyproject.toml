[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentvallet"
version = "0.1.0"
description = "Portable AI Work, Memory & Skill Brain: record observable AI work, validate it, and freeze it into portable, versioned agent skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentVallet contributors" }]
keywords = ["ai", "agents", "skills", "memory", "llm", "mcp"]
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
mcp = ["mcp>=1.2"]
graph = ["graphiti-core>=0.3"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-jsonschema", "httpx>=0.27"]
all = ["agentvallet[api,mcp,llm]"]

[project.scripts]
agentvallet = "agentvallet.cli:main"
av = "agentvallet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentvallet = ["api/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples/*/run.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
